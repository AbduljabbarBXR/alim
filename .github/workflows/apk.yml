name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite for the database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Name the artifact
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          cp app-arm64-v8a-release.apk alim-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alim-apk-arm64
          path: build/app/outputs/flutter-apk/alim-arm64-v8a.apk
          if-no-files-found: error
