name: alim
description: "Alim — your deen and your day, together. Qur'an, sahih hadith, stories, daily worship and work in one place."
publish_to: 'none'

version: 1.4.6+15

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1

  # Storage — the content database ships compressed and becomes the writable
  # database on first launch.
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2

  # Daily reminder
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

  # Sharing verses
  share_plus: ^10.1.4

  # The installed version, shown in Me instead of a hardcoded string
  package_info_plus: ^9.0.1

  # Place and prayer
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  adhan_dart: ^2.0.1

  # Landing exactly on a chosen ayah inside a long lazy list
  scrollable_positioned_list: ^0.3.8

  # Hijri calendar
  hijri: ^3.0.0
  intl: ^0.19.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/db/alim.db.gz
    - assets/data/quran_transliteration.json

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
